services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: rqbin
      POSTGRES_USER: rqbin
      POSTGRES_PASSWORD: rqbin
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rqbin -d rqbin"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      ADDR: ":8080"
      DATABASE_URL: postgres://rqbin:rqbin@db:5432/rqbin?sslmode=disable
      PUBLIC_BASE_URL: http://localhost:8080
      REQUEST_BODY_LIMIT: "1048576"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
